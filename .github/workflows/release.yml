name: Release

# Run manually from the Actions tab: bumps the semver tag, builds the universal app and publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump (major.minor.patch)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write       # create the tag and the release
  id-token: write       # sign the build provenance attestation
  attestations: write   # store it

# Never run two releases at once: both would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history and tags, to find the last version and list commits since
          persist-credentials: false

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Compute version and release notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          IFS=. read -r major minor patch <<< "${previous:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"

          range=${previous:+$previous..}HEAD
          changes=$(git log --no-merges --pretty='- %s (%h)' "$range")
          if [ -z "$changes" ]; then
            echo "::error::No commits since $previous, nothing to release."
            exit 1
          fi
          {
            echo "## Changes"
            echo
            echo "$changes"
            echo
            echo "## Install"
            echo
            echo "Download \`PokeMe-$version.zip\`, unzip it and move PokeMe to Applications."
            echo "It runs natively on Apple silicon and Intel Macs (macOS 14 or later)."
            echo "The app is not notarized: on first launch, click **Open Anyway** in"
            echo "System Settings › Privacy & Security."
          } > release-notes.md

          echo "Releasing v$version (previous: ${previous:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package universal app
        run: make package VERSION="${{ steps.version.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: PokeMe-*.zip

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "PokeMe-$VERSION.zip" "PokeMe-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "PokeMe v$VERSION" \
            --notes-file release-notes.md
