name: Release

# Push a tag like `v1.2.0` to build, package and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance attestation
  attestations: write   # store it

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Package
        run: make package VERSION="${GITHUB_REF_NAME#v}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: PokeMe-*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PokeMe-*.zip PokeMe-*.zip.sha256 \
            --title "PokeMe $GITHUB_REF_NAME" \
            --generate-notes
