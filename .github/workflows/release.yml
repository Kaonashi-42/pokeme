name: Release

# Push a tag like `v1.2.0` to build, package and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Package
        run: make package VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PokeMe-*.zip PokeMe-*.zip.sha256 \
            --title "PokeMe $GITHUB_REF_NAME" \
            --generate-notes
