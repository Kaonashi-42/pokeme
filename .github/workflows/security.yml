name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Weekly, to catch newly published advisories and CodeQL queries.

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the Swift code (injection, unsafe URL handling, insecure APIs…).
  codeql:
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:swift

  # Audit of the GitHub Actions workflows themselves (token permissions, injection, unpinned or vulnerable actions).
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}  # enables the online audits (known-vulnerable and impostor actions)
        run: pipx run zizmor==1.30.1 --format github .github/workflows
